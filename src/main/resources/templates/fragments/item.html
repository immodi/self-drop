<article th:fragment="item(item)" xmlns:th="http://www.thymeleaf.org"
         th:id="|item-${item.id}|"
         th:attr="data-seq=${item.seq}"
         th:classappend="${item.image or item.video} ? 'p-2 sm:p-3' : 'p-3 sm:p-4'"
         class="group relative rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:border-slate-300 hover:shadow-md dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700">

    <th:block th:if="${item.image or item.video}">
        <div class="relative min-h-40 overflow-hidden rounded-xl border border-slate-200 bg-slate-950 dark:border-slate-800"
             data-preview-container>
            <button type="button"
                    th:attr="data-preview-load=@{/preview/{id}(id=${item.id})},data-preview-id=${item.id},data-preview-kind=${item.video ? 'video' : 'image'},data-preview-alt=${item.name}"
                    th:title="${item.video ? 'Preview video' : 'Preview image'}"
                    class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-2 bg-slate-100 px-4 text-slate-500 transition hover:bg-slate-200/70 hover:text-slate-700 dark:bg-slate-800/60 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200">
                <svg th:if="${item.image}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="size-7" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/>
                </svg>
                <svg th:if="${item.video}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="size-7" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/>
                </svg>
                <span class="text-sm font-medium" th:text="${item.video ? 'Preview video' : 'Preview image'}"></span>
            </button>

            <button th:if="${item.image}" type="button" data-preview-target
                    th:attr="data-lightbox-src=@{/preview/{id}(id=${item.id})},data-lightbox-alt=${item.name}"
                    class="hidden w-full cursor-zoom-in"
                    title="View image full screen" aria-label="View image full screen">
                <img th:attr="data-preview-src=@{/preview/{id}(id=${item.id})}"
                     th:alt="${item.name}"
                     decoding="async"
                     class="block max-h-[70vh] w-full object-contain sm:max-h-[32rem]">
            </button>
            <video th:if="${item.video}" data-preview-target
                   th:attr="data-preview-src=@{/preview/{id}(id=${item.id})}"
                   controls
                   playsinline
                   preload="metadata"
                   th:title="${item.name}"
                   class="hidden max-h-[70vh] w-full bg-black object-contain sm:max-h-[32rem]">
                <a th:href="@{/download/{id}(id=${item.id})}" th:text="${item.name}"></a>
            </video>
        </div>

        <div class="mt-2 flex items-center gap-2 px-0.5 pb-0.5">
            <div class="min-w-0 flex-1">
                <p class="truncate text-sm font-medium text-slate-800 dark:text-slate-200" th:text="${item.name}"></p>
                <p class="mt-0.5 flex items-center gap-1.5 text-xs text-slate-400 dark:text-slate-500">
                    <span th:text="${item.sizeLabel}"></span>
                    <span aria-hidden="true">·</span>
                    <time th:datetime="${item.iso}" th:text="${item.time}"></time>
                </p>
            </div>

            <div class="flex shrink-0 items-center gap-0.5">
                <button th:if="${item.video}" type="button" data-video-fullscreen
                        class="hidden size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
                        title="Fullscreen" aria-label="Play video full screen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0 6 6m10.5-6h-4.5m4.5 0v4.5m0-4.5-6 6m-10.5 10.5v-4.5m0 4.5h4.5m-4.5 0 6-6m10.5 6h-4.5m4.5 0v-4.5m0 4.5-6-6"/>
                    </svg>
                </button>
                <button type="button"
                        th:attr="data-copy-url=@{/download/{id}(id=${item.id})}"
                        class="inline-flex size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
                        title="Copy download link" aria-label="Copy download link">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/>
                    </svg>
                </button>
                <a th:href="@{/download/{id}(id=${item.id})}"
                   class="inline-flex size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
                   title="Download" aria-label="Download" download>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                    </svg>
                </a>
                <button type="button"
                        th:attr="hx-delete=@{/file/{id}(id=${item.id})}"
                        hx-swap="none"
                        hx-confirm="Delete this item?"
                        data-remove-on-success
                        class="inline-flex size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-950/40 dark:hover:text-rose-400"
                        title="Delete" aria-label="Delete">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                    </svg>
                </button>
            </div>
        </div>
    </th:block>

    <div th:unless="${item.image or item.video}" class="flex gap-3">
        <div class="mt-0.5 flex size-9 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400">
            <svg th:if="${item.kind == 'text'}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3.75h6m-9 7.5h12a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 17.25 4.5h-10.5A2.25 2.25 0 0 0 4.5 6.75v10.5A2.25 2.25 0 0 0 6.75 19.5Z"/>
            </svg>
            <svg th:if="${item.kind == 'file'}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5A3.375 3.375 0 0 0 10.125 2.25H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
            </svg>
        </div>

        <div class="min-w-0 flex-1">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0 flex-1">
                    <div th:if="${item.kind == 'text'}"
                         class="item-text text-[15px] leading-relaxed text-slate-800 dark:text-slate-200"
                         th:utext="${item.textHtml}"></div>

                    <div th:if="${item.kind == 'file'}" class="flex min-w-0 items-center gap-3">
                        <div class="flex size-10 shrink-0 items-center justify-center rounded-xl bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-5" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5A3.375 3.375 0 0 0 10.125 2.25H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
                            </svg>
                        </div>
                        <div class="min-w-0">
                            <p class="truncate text-sm font-medium text-slate-800 dark:text-slate-200" th:text="${item.name}"></p>
                            <p class="text-xs text-slate-400 dark:text-slate-500" th:text="${item.sizeLabel}"></p>
                        </div>
                    </div>
                </div>

                <div class="flex shrink-0 items-center gap-1 opacity-100 transition sm:opacity-0 sm:group-hover:opacity-100 sm:group-focus-within:opacity-100">
                    <button th:if="${item.kind == 'text'}" type="button"
                            th:attr="data-copy=${item.text}"
                            class="inline-flex size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
                            title="Copy text" aria-label="Copy text">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75"/>
                        </svg>
                    </button>

                    <button th:if="${item.kind == 'file'}" type="button"
                            th:attr="data-copy-url=@{/download/{id}(id=${item.id})}"
                            class="inline-flex size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
                            title="Copy download link" aria-label="Copy download link">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/>
                        </svg>
                    </button>

                    <a th:if="${item.kind == 'file'}"
                       th:href="@{/download/{id}(id=${item.id})}"
                       class="inline-flex size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
                       title="Download" aria-label="Download" download>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                        </svg>
                    </a>

                    <button type="button"
                            th:attr="hx-delete=@{/file/{id}(id=${item.id})}"
                            hx-swap="none"
                            hx-confirm="Delete this item?"
                            data-remove-on-success
                            class="inline-flex size-8 items-center justify-center rounded-lg text-slate-400 transition hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-rose-950/40 dark:hover:text-rose-400"
                            title="Delete" aria-label="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.7" stroke="currentColor" class="size-4" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mt-2 flex items-center gap-2 text-[11px] text-slate-400 dark:text-slate-500">
                <time th:datetime="${item.iso}" th:text="${item.time}"></time>
                <span th:if="${item.kind == 'text' and item.size != null}"
                      class="before:mr-2 before:content-['·']"
                      th:text="${item.sizeLabel}"></span>
            </div>
        </div>
    </div>
</article>
