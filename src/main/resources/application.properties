spring.application.name=selfdrop
# Local secrets such as WORKER_URL and WORKER_TOKEN (git-ignored, optional).
spring.config.import=optional:file:.env[.properties]
server.address=0.0.0.0
server.port=8080
spring.datasource.url=jdbc:sqlite:./data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
storage.root=./data/files
storage.sweep.grace-seconds=1800
storage.sweep.interval-seconds=1800
# per-file ceiling
spring.servlet.multipart.max-file-size=2GB
# entire request: must cover ALL files in one request + form fields
spring.servlet.multipart.max-request-size=10GB
# 0 = write straight to disk, never buffer in heap. This is the default; keep it.
spring.servlet.multipart.file-size-threshold=0
# temp dir Spring buffers to. Must exist and be writable
spring.servlet.multipart.location=/var/tmp/selfdrop-uploads
server-id-path=./data/server-id
# how often the advertised LAN address is re-detected
address.refresh-millis=30000

# Rendezvous Worker (see README). Leave worker.url empty to disable publishing.
worker.url=${WORKER_URL:}
# Write token. Keep it in the environment; never expose it to the browser.
worker.token=${WORKER_TOKEN:}
worker.state-path=${WORKER_STATE_PATH:./data/worker-state.json}
# Publish a changed record within this window.
worker.publish-interval-millis=${WORKER_PUBLISH_INTERVAL_MILLIS:30000}
worker.publish-initial-delay-millis=${WORKER_PUBLISH_INITIAL_DELAY_MILLIS:3000}
