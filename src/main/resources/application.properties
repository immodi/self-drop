spring.application.name=selfdrop
server.address=localhost
server.port=8080
spring.datasource.url=jdbc:sqlite:./data/app.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
storage.root=./data/files
storage.sweep.grace-seconds=1800
storage.sweep.interval-seconds=1800
# per-file ceiling
spring.servlet.multipart.max-file-size=2GB
# entire request: must cover ALL files in one request + form fields
spring.servlet.multipart.max-request-size=10GB
# 0 = write straight to disk, never buffer in heap. This is the default; keep it.
spring.servlet.multipart.file-size-threshold=0
# temp dir Spring buffers to. Must exist and be writable
spring.servlet.multipart.location=/var/tmp/selfdrop-uploads
server-id-path=./data/server-id